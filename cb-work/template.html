<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Command Book — 命令速查</title>
<meta name="description" content="中文描述搜命令：Linux / Redis / Git 命令速查与配方，支持收藏、最近查看" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
<style>
:root, [data-theme="light"] {
  --bg:#ffffff; --panel:#ffffff; --popover:#ffffff; --modal:#ffffff;
  --border:#efeff5; --divider:#efeff5;
  --text-1:#1f2225; --text-2:#333639; --text-3:#767c82; --text-disabled:#c2c2c2;
  --primary:#18a058; --primary-hover:#36ad6a; --primary-active:#0c7a43; --primary-suppl:rgba(24,160,88,.12); --primary-rgb:24,160,88;
  --info:#2080f0; --info-suppl:rgba(32,128,240,.12); --info-rgb:32,128,240;
  --success:#18a058; --success-bg:rgba(24,160,88,.12);
  --warning:#f0a020; --warning-bg:rgba(240,160,32,.15);
  --error:#d03050;   --error-bg:rgba(208,48,80,.10);
  --recipe:#f0a020;
  --tag-bg:#efeff5;
  --code-bg:rgba(127,127,127,.1);
  --code-text:#24292e;
  --tok-comment:#6e7781; --tok-string:#0a3069;
  --shadow:0 8px 30px rgba(0,0,0,.18);
  --hover-bg:rgba(0,0,0,.06);
}
[data-theme="dark"] {
  --bg:#101014; --panel:#18181c; --popover:#202024; --modal:rgb(44,44,50);
  --border:rgba(255,255,255,.12); --divider:rgba(255,255,255,.09);
  --text-1:rgba(255,255,255,.9); --text-2:rgba(255,255,255,.82); --text-3:rgba(255,255,255,.52); --text-disabled:rgba(255,255,255,.38);
  --primary:#63e2b7; --primary-hover:#7fe7c4; --primary-active:#5acea7; --primary-suppl:rgba(99,226,183,.16); --primary-rgb:99,226,183;
  --info:#70c0e8; --info-suppl:rgba(112,192,232,.16); --info-rgb:112,192,232;
  --success:#63e2b7; --success-bg:rgba(99,226,183,.16);
  --warning:#f2c97d; --warning-bg:rgba(242,201,125,.16);
  --error:#e88080;   --error-bg:rgba(232,128,128,.16);
  --recipe:#f0a020;
  --tag-bg:rgba(255,255,255,.12);
  --code-bg:rgba(127,127,127,.1);
  --code-text:#e6edf3;
  --tok-comment:#8b949e; --tok-string:#a5d6ff;
  --shadow:0 8px 30px rgba(0,0,0,.5);
  --hover-bg:rgba(255,255,255,.08);
}
*,*:before,*:after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
  font-size:14px;line-height:1.6;color:var(--text-2);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .2s ease,color .2s ease;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(127,127,127,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(127,127,127,.5)}
*{scrollbar-width:thin;scrollbar-color:rgba(127,127,127,.3) transparent}
pre{margin:0;padding:12px 16px;border-radius:8px;overflow-x:auto;font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,Monaco,monospace;font-size:13px;line-height:1.5;color:var(--code-text)}
code{font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,Monaco,monospace;font-size:.9em}
button{font-family:inherit}

/* ---------- header ---------- */
.app-header{position:fixed;top:0;left:0;right:0;z-index:2000;height:52px;background:var(--panel);border-bottom:1px solid var(--divider)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 20px}
.header-left{display:flex;align-items:center;gap:10px}
.header-title{font-size:16px;font-weight:700;letter-spacing:-.3px;cursor:pointer;color:var(--text-1);white-space:nowrap}
.module-switcher{display:flex;align-items:center;gap:4px}
.header-right{display:flex;align-items:center;gap:8px}
.nav-count{margin-left:4px;font-size:11px;background:var(--info);color:#fff;border-radius:8px;padding:0 6px;line-height:16px;display:inline-block;min-width:16px;text-align:center}
.hbtn{display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--border);color:var(--text-2);border-radius:12px;padding:3px 10px;font-size:13px;line-height:1.6;cursor:pointer;transition:all .12s;white-space:nowrap}
.hbtn:hover{background:var(--hover-bg)}
.hbtn.on{color:var(--primary);border-color:var(--primary)}
.hbtn-icon{padding:3px 8px}

/* ntag */
.ntag{display:inline-flex;align-items:center;border-radius:4px;padding:1px 8px;line-height:1.7;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.ntag-small{padding:0 6px;font-size:11px;line-height:1.6}
.ntag-default{background:var(--tag-bg);color:var(--text-2)}
.ntag-primary{background:var(--primary-suppl);color:var(--primary);border-color:var(--primary)}
.ntag-success{background:var(--success-bg);color:var(--success);border-color:var(--success)}
.ntag-warning{background:var(--warning-bg);color:var(--warning);border-color:var(--warning)}
.ntag-error{background:var(--error-bg);color:var(--error);border-color:var(--error)}
.module-chip{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:2px 9px;font-size:12px;font-weight:500;border:1px solid transparent;cursor:pointer;transition:all .12s;line-height:1.6}
.module-chip-default{background:var(--tag-bg);color:var(--text-2);border-color:transparent}
.module-chip-default:hover{transform:translateY(-1px)}
.module-chip-active{background:var(--primary-suppl);color:var(--primary);border-color:var(--primary);box-shadow:0 2px 8px rgba(var(--primary-rgb),.25)}

/* ---------- layout ---------- */
.browser-body{padding-top:52px}
.app-sider{position:fixed;top:52px;left:0;bottom:0;width:220px;z-index:1500;background:var(--panel);border-right:1px solid var(--divider)}
.sider-inner{height:100%;display:flex;flex-direction:column;overflow-y:auto;padding-top:12px}
.sider-header{flex-shrink:0;padding:0 16px 12px;border-bottom:1px solid var(--divider);margin-bottom:8px}
.sider-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.6}
.sider-menu{padding:4px 8px}
.sider-item{display:flex;align-items:center;padding:7px 12px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text-2);margin-bottom:2px;transition:all .1s}
.sider-item:hover{background:var(--hover-bg)}
.sider-item.active{color:var(--primary);background:var(--primary-suppl);font-weight:600}
.sider-item .cnt{margin-left:auto;font-size:11px;opacity:.5}
.app-content{margin-left:220px;display:flex;justify-content:center}
.content-wrapper{width:100%;max-width:860px;padding:24px 40px}

/* ---------- view banner ---------- */
.view-banner{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.view-title{font-size:18px;font-weight:700;color:var(--text-1)}
.view-hint{font-size:12px;opacity:.5}

/* ---------- search ---------- */
.search-bar{margin-bottom:16px;position:relative}
.search-input-wrap{position:relative;display:flex;align-items:center}
.search-icon{position:absolute;left:14px;font-size:16px;pointer-events:none;opacity:.6}
.search-input-wrap input{width:100%;height:44px;padding:0 44px 0 42px;border:1px solid var(--border);border-radius:22px;background:var(--bg);color:var(--text-1);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.search-input-wrap input::placeholder{color:var(--text-3)}
.search-input-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-suppl)}
.shortcut-hint{position:absolute;right:14px;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;font-size:11px;font-weight:600;opacity:.4;border:1px solid currentColor}
.suggestions-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:800;background:var(--popover);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:320px;overflow-y:auto}
.suggestion-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;cursor:pointer;transition:background .1s}
.suggestion-item:hover,.suggestion-item--active{background:var(--primary-suppl)}
.suggestion-icon{font-size:14px;flex-shrink:0}
.suggestion-text{flex:1;font-size:14px;font-weight:500;color:var(--text-1)}
.suggestion-type{font-size:11px;opacity:.35;flex-shrink:0}

/* ---------- filter ---------- */
.filter-row{display:flex;align-items:center;gap:6px;margin-top:10px;padding:0 4px;flex-wrap:wrap}
.filter-chip{cursor:pointer;transition:all .12s;user-select:none;font-weight:500;background:var(--tag-bg);color:var(--text-2);border:1px solid transparent;border-radius:16px;padding:2px 14px;font-size:13px;line-height:1.7}
.filter-chip:hover{transform:translateY(-1px)}
.filter-chip--active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(var(--primary-rgb),.25)}
.filter-hint{font-size:11px;opacity:.35;margin-left:8px;user-select:none}

/* ---------- summary ---------- */
.result-summary{margin-bottom:12px;font-size:12px;opacity:.55;padding:0 4px}
.summary-cat{font-weight:600}
.summary-sep{margin:0 6px;opacity:.4}

/* ---------- command card ---------- */
.command-list{min-height:200px}
.command-card{position:relative;border:1px solid var(--border);border-left:3px solid transparent;border-radius:10px;padding:20px 24px;margin-bottom:12px;transition:all .15s ease;cursor:pointer;background:transparent}
.command-card:hover{border-color:var(--primary-hover)}
.command-card--selected{border-color:var(--primary);border-left:3px solid var(--primary);background:rgba(var(--primary-rgb),.06);box-shadow:0 0 0 1px var(--primary),0 0 20px -8px var(--primary)}
.command-card--selected:before{content:"▸";position:absolute;left:-6px;top:50%;transform:translateY(-50%);color:var(--primary);font-size:14px;line-height:1}
.command-card--compact{padding:10px 18px;margin-bottom:6px}
.command-card--compact .command-name{font-size:16px}
.command-card--compact .command-desc{display:none}
.command-card--compact .synopsis-block{margin-top:6px}
.command-card--compact .synopsis-block pre{padding:6px 12px!important;font-size:12px}
.command-card--compact .card-body{margin-top:10px}
.card-header{display:flex;align-items:center;justify-content:space-between}
.card-header-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.star-btn{background:none;border:none;cursor:pointer;font-size:18px;line-height:1;padding:2px;color:var(--text-3);transition:color .12s,transform .12s}
.star-btn:hover{transform:scale(1.15)}
.star-btn--on{color:var(--primary)}
.command-name{font-size:20px;font-weight:700;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;color:var(--primary)}
.module-badge{opacity:.65;text-transform:uppercase}
.danger-badge{font-size:11px}
.expand-indicator{font-size:14px;opacity:.4;color:var(--text-3)}
.command-desc{margin-top:8px;font-size:14px;opacity:.8;line-height:1.5}
.synopsis-block{margin-top:12px}
.synopsis-block pre{background:var(--code-bg)!important}
.card-body{margin-top:16px}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.cmd-tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;opacity:.55;background:var(--code-bg);color:var(--text-2);transition:opacity .15s,background .15s}
.cmd-tag.tag-highlighted{opacity:1;background:var(--primary-suppl);color:var(--primary);font-weight:600}
.sec-title{font-size:13px;font-weight:600;margin:10px 0 8px;opacity:.6;display:flex;align-items:center;gap:6px}
.sec-title svg{opacity:.8}
.options-list{display:flex;flex-direction:column;gap:6px}
.option-item{display:flex;gap:12px;align-items:baseline}
.option-name{font-family:"JetBrains Mono",Consolas,monospace;font-size:13px;font-weight:600;min-width:80px;color:var(--text-1)}
.option-desc{font-size:13px;opacity:.7}
.example-item{margin-bottom:14px}
.example-desc{font-size:13px;margin-bottom:6px;opacity:.8}
.code-wrapper{position:relative}
.example-code pre{background:var(--code-bg)!important}
.copy-btn{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:15px;opacity:.35;transition:opacity .15s;color:var(--text-1)}
.copy-btn:hover{opacity:1}
.related-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.related-label{font-size:13px;opacity:.6}
.related-tag{cursor:pointer}
.related-tag:hover{opacity:.8}

/* ---------- recipe card ---------- */
.recipe-card{position:relative;border:1px solid var(--border);border-left:3px solid var(--recipe);border-radius:10px;padding:20px 24px;margin-bottom:12px;transition:all .15s ease;cursor:pointer;background:transparent}
.recipe-card:hover{border-color:var(--recipe)}
.recipe-card--selected{border-color:var(--recipe);background:rgba(240,160,32,.06);box-shadow:0 0 0 1px var(--recipe),0 0 20px -8px rgba(240,160,32,.5)}
.recipe-header{display:flex;align-items:center;justify-content:space-between}
.recipe-header-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.recipe-badge{font-size:11px;font-weight:700;color:var(--recipe);border:1px solid rgba(240,160,32,.5);border-radius:6px;padding:1px 8px}
.recipe-name{font-size:18px;font-weight:700;color:var(--text-1)}
.recipe-desc{margin-top:8px;font-size:14px;opacity:.8;line-height:1.5}
.recipe-fullcmd{margin-top:12px;position:relative}
.fullcmd-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.4;margin-bottom:6px}
.fullcmd-code pre{background:var(--code-bg)!important}
.recipe-fullcmd .copy-btn{top:auto;bottom:12px;right:8px}
.recipe-body{margin-top:16px}
.recipe-tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;opacity:.55;background:var(--code-bg);color:var(--text-2)}
.recipe-tag.tag-highlighted{opacity:1;background:var(--primary-suppl);color:var(--primary);font-weight:600}
.step-item{margin-bottom:10px}
.step-desc{font-size:13px;margin-bottom:6px;opacity:.85}
.step-code pre{background:var(--code-bg)!important}

/* ---------- empty ---------- */
.empty-state{margin-top:80px;text-align:center}
.empty-hint{font-size:13px;opacity:.5}

/* ---------- back top ---------- */
.back-top-btn{position:fixed;bottom:40px;right:40px;width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:1000;border:none;transition:transform .15s,box-shadow .15s}
.back-top-btn:hover{transform:translateY(-2px)}
.back-top-arrow{font-size:18px;line-height:1}

/* ---------- toast ---------- */
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--popover);color:var(--text-1);border:1px solid var(--border);border-radius:10px;padding:8px 18px;font-size:13px;box-shadow:var(--shadow);z-index:3000;opacity:0;pointer-events:none;transition:all .2s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2500;display:flex;align-items:center;justify-content:center}
.modal{background:var(--modal);border-radius:12px;box-shadow:var(--shadow);width:420px;max-width:92vw;padding:22px 24px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text-1)}
.modal-section{margin-bottom:16px}
.modal-label{font-size:13px;font-weight:600;margin-bottom:8px;opacity:.75}
.modal-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--error);color:var(--error);border-radius:8px;padding:5px 14px;font-size:13px;cursor:pointer;transition:all .12s}
.modal-btn:hover{background:var(--error-bg)}
.modal-btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- token colors ---------- */
.tok-comment{color:var(--tok-comment);font-style:italic}
.tok-string{color:var(--tok-string)}

/* ---------- responsive ---------- */
@media (max-width:768px){
  .app-sider{display:none}
  .app-content{margin-left:0}
  .content-wrapper{padding:16px 14px}
  .header-title{font-size:14px}
  .module-switcher{display:none}
}
</style>
</head>
<body data-theme="dark">
<header class="app-header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-title" id="brandTitle">📖 Command Book</div>
      <div class="module-switcher" id="moduleSwitcher"></div>
    </div>
    <div class="header-right">
      <button class="hbtn" id="btnRecent" title="最近查看">🕘 最近<span class="nav-count" id="recentCount">0</span></button>
      <button class="hbtn" id="btnFav" title="我的收藏">☆ 收藏</button>
      <button class="hbtn" id="btnCompact" title="切换紧凑模式">☰ 紧凑</button>
      <button class="hbtn" id="btnTheme" title="切换主题">☀ 亮色</button>
      <button class="hbtn hbtn-icon" id="btnSettings" title="设置">⚙</button>
    </div>
  </div>
</header>

<div class="browser-body">
  <aside class="app-sider">
    <div class="sider-inner">
      <div class="sider-header"><span class="sider-title">命令分类</span></div>
      <div class="sider-menu" id="siderMenu"></div>
    </div>
  </aside>
  <div class="app-content">
    <div class="content-wrapper">
      <div class="view-banner" id="viewBanner" style="display:none">
        <span class="view-title" id="viewTitle"></span>
        <span class="view-hint" id="viewHint"></span>
      </div>

      <div class="search-bar">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input id="searchInput" type="text" autocomplete="off" placeholder="输入描述查找命令，空格分隔多关键词...（如：删除 文件夹、压缩 解压、磁盘 空间）" />
          <span class="shortcut-hint">/</span>
        </div>
        <div class="suggestions-panel" id="suggestions" style="display:none"></div>
      </div>

      <div class="filter-row">
        <span class="filter-chip filter-chip--active" data-type="all">全部</span>
        <span class="filter-chip" data-type="command">命令 · <span id="chipCommandCount">0</span></span>
        <span class="filter-chip" data-type="recipe">配方 · <span id="chipRecipeCount">0</span></span>
        <span class="filter-hint">或输入 #recipe / #命令 快捷切换</span>
      </div>

      <div class="result-summary" id="resultSummary"></div>
      <div class="command-list" id="commandList"></div>
      <div class="empty-state" id="emptyState" style="display:none"><div class="empty-hint">没有匹配的结果，试试调整关键词或筛选条件</div></div>
    </div>
  </div>
</div>

<button class="back-top-btn" id="backTop" style="display:none" title="回到顶部"><span class="back-top-arrow">↑</span></button>

<div class="modal-mask" id="settingsMask" style="display:none">
  <div class="modal">
    <div class="modal-title">⛭ 设置</div>
    <div class="modal-section">
      <div class="modal-label">最近查看</div>
      <button class="modal-btn" id="btnClearRecent">清空最近查看（<span id="clearRecentCount">0</span>）</button>
    </div>
    <div class="modal-section">
      <div class="modal-label">收藏</div>
      <button class="modal-btn" id="btnClearFav">清空收藏（<span id="clearFavCount">0</span>）</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA = __DATA_PLACEHOLDER__;
const MODULES = { linux:{name:'Linux',icon:'🐧',lang:'bash'}, redis:{name:'Redis',icon:'🔴',lang:'redis'}, git:{name:'Git',icon:'🔀',lang:'bash'} };
const DANGER = { low:{cls:'ntag-success',label:'低危'}, medium:{cls:'ntag-warning',label:'中危'}, high:{cls:'ntag-error',label:'高危'}, critical:{cls:'ntag-error',label:'极高危'} };

function loadStore(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveStore(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

const state = {
  module:'linux', view:'module', search:'', type:'all', category:'__all__',
  compact:false, theme:'dark', expanded:new Set(), suggestionIdx:-1,
};

let favorites = loadStore('cb.favorites.v2', []);
let recent = loadStore('cb.recent.v2', []);

const $ = (s)=>document.querySelector(s);
const commands = ()=> DATA[state.module].commands;
const recipes = ()=> DATA[state.module].recipes;

function favKey(m,t,n){ return m+'|'+t+'|'+n; }
function isFav(m,t,n){ return favorites.some(f=>f.key===favKey(m,t,n)); }
function toggleFav(m,t,n){ const k=favKey(m,t,n); const i=favorites.findIndex(f=>f.key===k); if(i>=0) favorites.splice(i,1); else favorites.unshift({key:k,module:m,type:t,name:n}); saveStore('cb.favorites.v2',favorites); render(); }
function pushRecent(m,t,n){ const k=favKey(m,t,n); recent=recent.filter(f=>f.key!==k); recent.unshift({key:k,module:m,type:t,name:n}); if(recent.length>50) recent=recent.slice(0,50); saveStore('cb.recent.v2',recent); }

/* ------- search parsing ------- */
function parseSearch(){
  let q = state.search.trim(); let type = state.type;
  const toks = q.split(/\s+/).filter(Boolean);
  const clean = [];
  for(const t of toks){
    if(t==='#recipe'||t==='#配方'){ type='recipe'; continue; }
    if(t==='#命令'||t==='#command'||t==='#cmd'){ type='command'; continue; }
    if(t==='#all'||t==='#全部'){ type='all'; continue; }
    clean.push(t.toLowerCase());
  }
  return { terms:clean, type };
}

/* ------- filtering ------- */
function matchesItem(item, type, terms){
  if(!terms.length) return true;
  const hay = type==='command'
    ? [item.name,item.description,item.synopsis,(item.tags||[]).join(' ')].join(' ').toLowerCase()
    : [item.name,item.description,item.fullCommand,(item.tags||[]).join(' ')].join(' ').toLowerCase();
  return terms.every(t=>hay.includes(t));
}
function highlightTags(tags, terms){
  if(!terms.length) return (tags||[]);
  return (tags||[]).map(t=>{
    const low=t.toLowerCase();
    return terms.some(k=>low.includes(k)||k.includes(low));
  });
}
function getFiltered(){
  const { terms, type } = parseSearch();
  const cmds = commands().filter(c =>
    (type==='all'||type==='command') &&
    (state.category==='__all__'||c.category===state.category) &&
    matchesItem(c,'command',terms)
  );
  const recs = recipes().filter(r =>
    (type==='all'||type==='recipe') &&
    (state.category==='__all__'||r.category===state.category) &&
    matchesItem(r,'recipe',terms)
  );
  return { cmds, recs, terms };
}

/* ------- highlight code ------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hlLine(line){
  let out='',buf=''; const n=line.length;
  const flush=()=>{ if(buf){ out+=esc(buf); buf=''; } };
  for(let i=0;i<n;i++){
    const ch=line[i];
    if(ch==="'"||ch==='"'||ch==='`'){
      flush();
      const q=ch; let j=i+1,s='';
      while(j<n && line[j]!==q){ s+=line[j]; j++; }
      out+='<span class="tok-string">'+esc(q+s+(j<n?q:''))+'</span>';
      i = j<n ? j : n-1; // if not closed, we consumed until end
      if(j>=n) { i=n; }
      continue;
    }
    if(ch==='#' && (i===0||/\s/.test(line[i-1]))){ flush(); out+='<span class="tok-comment">'+esc(line.slice(i))+'</span>'; return out; }
    if(ch==='/' && line[i+1]==='/'){ flush(); out+='<span class="tok-comment">'+esc(line.slice(i))+'</span>'; return out; }
    buf+=ch;
  }
  flush();
  return out;
}
function highlight(code){
  const lines = String(code).split('\n');
  return lines.map(l=>'<span class="line">'+(hlLine(l)||'&nbsp;')+'</span>').join('\n');
}
function codeBlock(code, extra){
  return '<pre><code>'+(highlight(code))+'</code></pre>'+(extra||'');
}
function copyBtn(){
  return '<button class="copy-btn" data-copy title="复制">⧉</button>';
}

/* ------- card rendering ------- */
function dangerBadge(level){
  const d = DANGER[level] || DANGER.medium;
  return '<span class="ntag ntag-small danger-badge '+d.cls+'">'+d.label+'</span>';
}
function moduleBadge(m){
  return '<span class="ntag ntag-small module-badge ntag-default">'+m+'</span>';
}
function starBtn(m,t,n){
  const on = isFav(m,t,n);
  return '<button class="star-btn'+(on?' star-btn--on':'')+'" data-star data-m="'+m+'" data-t="'+t+'" data-n="'+esc(n)+'" title="'+(on?'取消收藏':'收藏')+'">'+(on?'★':'☆')+'</button>';
}
function commandCard(c){
  const key = state.module+'|command|'+c.name;
  const expanded = state.expanded.has(key);
  const { terms } = parseSearch();
  const tags = c.tags||[];
  const tagFlags = highlightTags(tags, terms);
  let html = '<div class="command-card'+(expanded?' command-card--selected':'')+(state.compact?' command-card--compact':'')+'" data-open data-key="'+esc(key)+'">';
  html += '<div class="card-header"><div class="card-header-left">';
  html += starBtn(state.module,'command',c.name);
  html += '<span class="command-name">'+esc(c.name)+'</span>';
  html += moduleBadge(c._module);
  html += dangerBadge(c.danger_level);
  html += '</div><span class="expand-indicator">'+(expanded?'▾':'▸')+'</span></div>';
  html += '<p class="command-desc">'+esc(c.description)+'</p>';
  html += '<div class="synopsis-block">'+codeBlock(c.synopsis||'')+'</div>';
  if(expanded){
    html += '<div class="card-body">';
    if(tags.length){ html += '<div class="tags-row">'+tags.map((t,i)=>'<span class="cmd-tag'+(tagFlags[i]?' tag-highlighted':'')+'">'+esc(t)+'</span>').join('')+'</div>'; }
    const opts = c.common_options||[];
    if(opts.length){
      html += '<div class="sec-title">▸ 常用参数</div><div class="options-list">';
      html += opts.map(o=>'<div class="option-item"><code class="option-name">'+esc(o.name)+'</code><span class="option-desc">'+esc(o.description||'')+'</span></div>').join('');
      html += '</div>';
    }
    const ex = c.examples||[];
    if(ex.length){
      html += '<div class="sec-title">▸ 示例</div>';
      html += ex.map(e=>'<div class="example-item"><p class="example-desc">'+esc(e.description||'')+'</p><div class="code-wrapper">'+copyBtn()+codeBlock(e.code)+'</div></div>').join('');
    }
    const rel = c.related||[];
    if(rel.length){
      html += '<div class="related-row"><span class="related-label">相关命令：</span>'+rel.map(r=>'<span class="ntag ntag-small related-tag ntag-default" data-rel="'+esc(r)+'">'+esc(r)+'</span>').join('')+'</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}
function recipeCard(r){
  const key = state.module+'|recipe|'+r.name;
  const expanded = state.expanded.has(key);
  const { terms } = parseSearch();
  const tags = r.tags||[];
  const tagFlags = highlightTags(tags, terms);
  let html = '<div class="recipe-card'+(expanded?' recipe-card--selected':'')+'" data-open data-key="'+esc(key)+'">';
  html += '<div class="recipe-header"><div class="recipe-header-left">';
  html += starBtn(state.module,'recipe',r.name);
  html += '<span class="recipe-badge">📋 配方</span>';
  html += '<span class="recipe-name">'+esc(r.name)+'</span>';
  html += moduleBadge(r._module);
  html += '</div><span class="expand-indicator">'+(expanded?'▾':'▸')+'</span></div>';
  html += '<p class="recipe-desc">'+esc(r.description)+'</p>';
  html += '<div class="recipe-fullcmd"><div class="fullcmd-label">一键执行：</div><div class="code-wrapper">'+copyBtn()+'<div class="fullcmd-code">'+codeBlock(r.fullCommand)+'</div></div></div>';
  if(expanded){
    html += '<div class="recipe-body">';
    if(tags.length){ html += '<div class="tags-row">'+tags.map((t,i)=>'<span class="recipe-tag'+(tagFlags[i]?' tag-highlighted':'')+'">'+esc(t)+'</span>').join('')+'</div>'; }
    const steps = r.steps||[];
    if(steps.length){
      html += '<div class="sec-title">▸ 步骤拆解</div>';
      html += steps.map(s=>'<div class="step-item"><p class="step-desc">'+esc(s.description||'')+'</p><div class="code-wrapper">'+copyBtn()+'<div class="step-code">'+codeBlock(s.code)+'</div></div></div>').join('');
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* ------- render ------- */
function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.body.setAttribute('data-theme', state.theme);

  // module switcher
  const ms = document.getElementById('moduleSwitcher');
  ms.innerHTML = Object.keys(MODULES).map(m=>{
    const on = state.module===m && state.view==='module';
    return '<span class="module-chip'+(on?' module-chip-active':' module-chip-default')+'" data-module="'+m+'">'+MODULES[m].icon+' '+MODULES[m].name+'</span>';
  }).join('');

  // theme button
  const tb = document.getElementById('btnTheme');
  tb.innerHTML = state.theme==='dark' ? '☀ 亮色' : '🌙 暗色';
  document.getElementById('btnCompact').classList.toggle('on', state.compact);
  document.getElementById('btnFav').classList.toggle('on', state.view==='favorites');
  document.getElementById('btnRecent').classList.toggle('on', state.view==='recent');
  document.getElementById('recentCount').textContent = recent.length;

  // sider (only for module view)
  const siderMenu = document.getElementById('siderMenu');
  const cats = [...new Set(commands().map(c=>c.category))];
  const inModuleView = state.view==='module';
  if(inModuleView){
    let items = '<div class="sider-item'+(state.category==='__all__'?' active':'')+'" data-cat="__all__">全部命令<span class="cnt">'+commands().length+'</span></div>';
    items += cats.map(c=>{
      const cnt = commands().filter(x=>x.category===c).length;
      return '<div class="sider-item'+(state.category===c?' active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'<span class="cnt">'+cnt+'</span></div>';
    }).join('');
    siderMenu.innerHTML = items;
  } else {
    siderMenu.innerHTML = '';
  }

  // banner
  const banner = document.getElementById('viewBanner');
  const viewTitle = document.getElementById('viewTitle');
  const viewHint = document.getElementById('viewHint');
  if(state.view!=='module'){
    banner.style.display='flex';
    viewTitle.textContent = state.view==='favorites' ? '我的收藏' : '最近查看';
    const list = state.view==='favorites' ? favorites : recent;
    viewHint.textContent = '共 '+list.length+' 条 · 支持搜索过滤';
  } else {
    banner.style.display='none';
  }

  // type filter chips + counts
  const totalCmds = commands().length, totalRecs = recipes().length;
  document.getElementById('chipCommandCount').textContent = totalCmds;
  document.getElementById('chipRecipeCount').textContent = totalRecs;
  document.querySelectorAll('.filter-chip').forEach(ch=>{
    ch.classList.toggle('filter-chip--active', state.type===ch.dataset.type);
  });

  // visible list depends on view
  let listHtml = '';
  let items;
  if(state.view==='module'){
    const { cmds, recs, terms } = getFiltered();
    // rebuild list: commands first (original has commands then recipes? actually data stores recipes at end)
    // order: commands sorted as-is, then recipes
    listHtml = cmds.map(commandCard).join('') + recs.map(recipeCard).join('');
    items = cmds.length+recs.length;

    // summary
    const sum = document.getElementById('resultSummary');
    let s='';
    if(state.category!=='__all__'){ s += '<span class="summary-cat">📁 '+esc(state.category)+'</span><span class="summary-sep">·</span>'; }
    s += cmds.length+' 条命令';
    if(recs.length>0) s += ' · '+recs.length+' 个配方';
    sum.innerHTML = s;
  } else {
    // favorites / recent views: gather matching cards across modules
    document.getElementById('resultSummary').innerHTML='';
    const src = state.view==='favorites' ? favorites : recent;
    const { terms, type } = parseSearch();
    const htmlArr = [];
    for(const f of src){
      // find module item
      const mod = DATA[f.module]; if(!mod) continue;
      const target = (f.type==='recipe'?mod.recipes:mod.commands).find(x=>x.name===f.name);
      if(!target) continue;
      if(!matchesItem(target,f.type,terms)) continue;
      if(type==='command' && f.type!=='command') continue;
      if(type==='recipe' && f.type!=='recipe') continue;
      // render card with its module context (temporarily switch state.module)
      const prevM=state.module, prevC=state.category;
      state.module=f.module; state.category='__all__';
      htmlArr.push(f.type==='recipe'?recipeCard(target):commandCard(target));
      state.module=prevM; state.category=prevC;
    }
    listHtml = htmlArr.join('');
    items = htmlArr.length;
  }

  document.getElementById('commandList').innerHTML = listHtml;
  document.getElementById('emptyState').style.display = items===0?'block':'none';

  // settings modal counts
  document.getElementById('clearRecentCount').textContent = recent.length;
  document.getElementById('clearFavCount').textContent = favorites.length;
  document.getElementById('btnClearRecent').disabled = recent.length===0;
  document.getElementById('btnClearFav').disabled = favorites.length===0;
}

/* ------- suggestions ------- */
function renderSuggestions(){
  const panel = document.getElementById('suggestions');
  const q = state.search.trim();
  if(!q){ panel.style.display='none'; return; }
  const { terms } = parseSearch();
  const mod = DATA[state.module];
  const common=[];
  const cmdMatches = mod.commands.filter(c=>matchesItem(c,'command',terms)).slice(0,6);
  const recMatches = mod.recipes.filter(r=>matchesItem(r,'recipe',terms)).slice(0,4);
  common.push(...cmdMatches.map(c=>({type:'command',name:c.name,module:state.module})));
  common.push(...recMatches.map(r=>({type:'recipe',name:r.name,module:state.module})));
  if(!common.length){ panel.style.display='none'; return; }
  panel.innerHTML = common.map((s,i)=>'<div class="suggestion-item'+(i===state.suggestionIdx?' suggestion-item--active':'')+'" data-sug="'+esc(s.name)+'" data-stype="'+s.type+'"><span class="suggestion-icon">'+(s.type==='command'?'⌨':'🏷')+'</span><span class="suggestion-text">'+esc(s.name)+'</span><span class="suggestion-type">'+s.module+'</span></div>').join('');
  panel.style.display='block';
}

/* ------- helpers ------- */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}
async function doCopy(text){
  try{ await navigator.clipboard.writeText(text); toast('已复制到剪贴板'); }
  catch(e){ toast('复制失败，请手动选择复制'); }
}
function openCard(key){
  state.expanded.clear();
  state.expanded.add(key);
  render();
  const el=document.querySelector('[data-key="'+CSS.escape(key)+'"]');
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ------- events ------- */
document.getElementById('brandTitle').addEventListener('click',()=>{ state.view='module'; state.search=''; state.category='__all__'; state.type='all'; render(); });

document.getElementById('moduleSwitcher').addEventListener('click',(e)=>{
  const chip=e.target.closest('[data-module]'); if(!chip) return;
  state.module=chip.dataset.module; state.view='module'; state.category='__all__'; state.search=''; state.type='all'; state.expanded.clear(); render();
});

document.getElementById('siderMenu').addEventListener('click',(e)=>{
  const it=e.target.closest('[data-cat]'); if(!it) return;
  state.category=it.dataset.cat; render();
});

document.querySelectorAll('.filter-chip').forEach(ch=>{
  ch.addEventListener('click',()=>{ state.type=ch.dataset.type; render(); });
});

document.getElementById('searchInput').addEventListener('input',(e)=>{ state.search=e.target.value; state.suggestionIdx=-1; renderSuggestions(); render(); });
document.getElementById('searchInput').addEventListener('focus',()=>renderSuggestions());
document.getElementById('searchInput').addEventListener('blur',()=>{ setTimeout(()=>{ document.getElementById('suggestions').style.display='none'; },150); });
document.getElementById('searchInput').addEventListener('keydown',(e)=>{
  const panel=document.getElementById('suggestions');
  const items=[...panel.querySelectorAll('.suggestion-item')];
  if(e.key==='ArrowDown'&&items.length){ e.preventDefault(); state.suggestionIdx=(state.suggestionIdx+1)%items.length; renderSuggestions(); return; }
  if(e.key==='ArrowUp'&&items.length){ e.preventDefault(); state.suggestionIdx=(state.suggestionIdx-1+items.length)%items.length; renderSuggestions(); return; }
  if(e.key==='Enter'){
    const cur=items[state.suggestionIdx];
    if(cur){ e.preventDefault(); const name=cur.dataset.sug, stype=cur.dataset.stype; state.search=name; panel.style.display='none'; state.expanded.clear(); state.expanded.add(state.module+'|'+stype+'|'+name); render(); }
  }
  if(e.key==='Escape'){ panel.style.display='none'; }
});

document.getElementById('suggestions').addEventListener('mousedown',(e)=>{
  const it=e.target.closest('[data-sug]'); if(!it) return;
  const name=it.dataset.sug, stype=it.dataset.stype;
  state.search=name; document.getElementById('suggestions').style.display='none';
  state.category='__all__'; state.type='all';
  openCard(state.module+'|'+stype+'|'+name);
});

// command list delegation
document.getElementById('commandList').addEventListener('click',(e)=>{
  const copy=e.target.closest('[data-copy]');
  if(copy){ const pre=copy.closest('.code-wrapper')?.querySelector('pre'); if(pre) doCopy(pre.textContent); return; }
  const star=e.target.closest('[data-star]');
  if(star){ toggleFav(star.dataset.m,star.dataset.t,star.dataset.n); return; }
  const rel=e.target.closest('[data-rel]');
  if(rel){
    const name=rel.dataset.rel;
    state.search=''; state.category='__all__'; state.type='all';
    openCard(state.module+'|command|'+name);
    return;
  }
  const card=e.target.closest('[data-open]');
  if(card){
    const key=card.dataset.key;
    const [m,t,n]=key.split('|');
    pushRecent(m,t,n);
    if(state.expanded.has(key)){ state.expanded.delete(key); } else { state.expanded.clear(); state.expanded.add(key); }
    render();
  }
});

document.getElementById('btnRecent').addEventListener('click',()=>{ state.view = state.view==='recent'?'module':'recent'; state.search=''; state.category='__all__'; state.type='all'; state.expanded.clear(); render(); });
document.getElementById('btnFav').addEventListener('click',()=>{ state.view = state.view==='favorites'?'module':'favorites'; state.search=''; state.category='__all__'; state.type='all'; state.expanded.clear(); render(); });
document.getElementById('btnCompact').addEventListener('click',()=>{ state.compact=!state.compact; render(); });
document.getElementById('btnTheme').addEventListener('click',()=>{ state.theme = state.theme==='dark'?'light':'dark'; localStorage.setItem('cb.theme', JSON.stringify(state.theme==='dark')); render(); });

document.getElementById('btnSettings').addEventListener('click',()=>{ document.getElementById('settingsMask').style.display='flex'; });
document.getElementById('settingsMask').addEventListener('click',(e)=>{ if(e.target.id==='settingsMask') document.getElementById('settingsMask').style.display='none'; });
document.getElementById('btnClearRecent').addEventListener('click',()=>{ recent=[]; saveStore('cb.recent.v2',recent); toast('已清空最近查看'); render(); });
document.getElementById('btnClearFav').addEventListener('click',()=>{ favorites=[]; saveStore('cb.favorites.v2',favorites); toast('已清空收藏'); render(); });

// back to top
const backTop=document.getElementById('backTop');
window.addEventListener('scroll',()=>{ backTop.style.display = window.scrollY>400?'flex':'none'; });
backTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

// "/" shortcut to focus search
document.addEventListener('keydown',(e)=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); document.getElementById('searchInput').focus();
  }
});

// init theme from storage
try{ const t=JSON.parse(localStorage.getItem('cb.theme')||'null'); if(t!==null) state.theme = t ? 'dark' : 'light'; }catch(e){}
state.compact = (()=>{ try{ return localStorage.getItem('cb.compact')==='true'; }catch(e){ return false; } })();

render();
</script>
